    <text x="66" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DC8A67">1. INGEST</text>
    <text x="36" y="102" font-size="13.5" font-weight="600" fill="#EDE7DF">Plaud Cloud Sync</text>
    <text x="36" y="122" font-size="11.5" fill="#A49B90">@plaud-ai/cli wrapper</text>
    <text x="36" y="139" font-size="11.5" fill="#A49B90">5m auto-poll + manual</text>
    <text x="36" y="156" font-size="11.5" fill="#A49B90">Audio, marks &amp; Plaud notes</text>

