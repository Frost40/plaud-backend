      <path d="M196 105 H220"/>
      <path d="M402 105 H426"/>
      <path d="M642 105 H666"/>
      <path d="M534 176 V206" stroke="#3C3732"/>
      <path d="M311 176 V206" stroke="#3C3732"/>
