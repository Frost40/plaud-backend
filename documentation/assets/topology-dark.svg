    <text x="438" y="102" font-size="13.5" font-weight="600" fill="#EDE7DF">ASR + Diarization</text>
    <text x="438" y="122" font-size="11.5" fill="#A49B90">Whisper turbo (block Mel + VAD)</text>
    <text x="438" y="139" font-size="11.5" fill="#A49B90">Optional Parakeet + LLM arbiter</text>
    <text x="438" y="156" font-size="11.5" fill="#A49B90">pyannote GPU / sherpa fallback</text>

    <rect x="666" y="48" width="190" height="128" rx="12" fill="#252220" stroke="#3C3732"/>
