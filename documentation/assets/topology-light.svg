<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" role="img" aria-label="End-to-end Plaud Backend system topology">
  <rect x="0.5" y="0.5" width="879" height="309" rx="16" fill="#FAF7F2" stroke="#E4DDD2"/>
  <g font-family="Segoe UI Variable Text, Segoe UI, system-ui, -apple-system, sans-serif">
    <!-- Section Title -->
    <text x="24" y="30" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6E665E">SYSTEM TOPOLOGY · SERIALIZED SINGLE-GPU WORKER</text>

    <!-- Arrows -->
    <g stroke="#B8522D" stroke-width="1.6" fill="none">
      <path d="M196 105 H220"/>
      <path d="M402 105 H426"/>
      <path d="M642 105 H666"/>
      <!-- Return arrow from Obsidian / Dashboard -->
      <path d="M534 176 V206" stroke="#E4DDD2"/>
      <path d="M311 176 V206" stroke="#E4DDD2"/>
      <path d="M763 176 V206" stroke="#E4DDD2"/>
    </g>

    <!-- Column 1: Plaud Sync -->
    <rect x="24" y="48" width="172" height="128" rx="12" fill="#FEFCFA" stroke="#E4DDD2"/>
    <rect x="36" y="60" width="60" height="20" rx="10" fill="#F6E7E0"/>
    <text x="66" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B8522D">1. INGEST</text>
    <text x="36" y="102" font-size="13.5" font-weight="600" fill="#292522">Plaud Cloud Sync</text>
    <text x="36" y="122" font-size="11.5" fill="#6E665E">@plaud-ai/cli wrapper</text>
    <text x="36" y="139" font-size="11.5" fill="#6E665E">5m auto-poll + manual</text>
    <text x="36" y="156" font-size="11.5" fill="#6E665E">Audio, marks &amp; Plaud notes</text>

    <!-- Column 2: Queue & Server -->
    <rect x="220" y="48" width="182" height="128" rx="12" fill="#FEFCFA" stroke="#E4DDD2"/>
    <rect x="232" y="60" width="66" height="20" rx="10" fill="#F3EEE5"/>
    <text x="265" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#292522">2. QUEUE</text>
    <text x="232" y="102" font-size="13.5" font-weight="600" fill="#292522">FastAPI + SQLite</text>
    <text x="232" y="122" font-size="11.5" fill="#6E665E">jobs.db · 1 GPU job at a time</text>
    <text x="232" y="139" font-size="11.5" fill="#6E665E">Stage checkpoints &amp; resume</text>
    <text x="232" y="156" font-size="11.5" fill="#6E665E">Adaptive ETA (timings.json)</text>

    <!-- Column 3: Local GPU Pipeline -->
    <rect x="426" y="48" width="216" height="128" rx="12" fill="#FEFCFA" stroke="#B8522D" stroke-width="1.4"/>
    <rect x="438" y="60" width="96" height="20" rx="10" fill="#F6E7E0"/>
    <text x="486" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B8522D">3. LOCAL GPU</text>
    <text x="438" y="102" font-size="13.5" font-weight="600" fill="#292522">ASR + Diarization</text>
    <text x="438" y="122" font-size="11.5" fill="#6E665E">Whisper turbo (block Mel + VAD)</text>
    <text x="438" y="139" font-size="11.5" fill="#6E665E">Optional Parakeet + LLM arbiter</text>
    <text x="438" y="156" font-size="11.5" fill="#6E665E">pyannote GPU / sherpa fallback</text>

    <!-- Column 4: AI Notes & Vault -->
    <rect x="666" y="48" width="190" height="128" rx="12" fill="#FEFCFA" stroke="#E4DDD2"/>
    <rect x="678" y="60" width="76" height="20" rx="10" fill="#F3EEE5"/>
    <text x="716" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#292522">4. SYNTHESIS</text>
    <text x="678" y="102" font-size="13.5" font-weight="600" fill="#292522">Blueprints &amp; Vault</text>
    <text x="678" y="122" font-size="11.5" fill="#6E665E">18 Markdown blueprints</text>
    <text x="678" y="139" font-size="11.5" fill="#6E665E">_cascade.md provider fallback</text>
    <text x="678" y="156" font-size="11.5" fill="#6E665E">Hub, Transcript &amp; Notes (.md)</text>

    <!-- Bottom Row: Feedback Loops -->
    <rect x="24" y="206" width="272" height="80" rx="12" fill="#F3EEE5" stroke="#E4DDD2"/>
    <text x="38" y="229" font-size="12.5" font-weight="600" fill="#292522">Warm Studio UI (:8377 / :8378)</text>
    <text x="38" y="248" font-size="11.5" fill="#6E665E">Inline speaker cards, passage fixes, ⇄ overlaps</text>
    <text x="38" y="265" font-size="11.5" fill="#6E665E">Click-to-play audio · Drag-and-drop folders</text>

    <rect x="312" y="206" width="268" height="80" rx="12" fill="#F3EEE5" stroke="#E4DDD2"/>
    <text x="326" y="229" font-size="12.5" font-weight="600" fill="#292522">Self-Learning Memory</text>
    <text x="326" y="248" font-size="11.5" fill="#6E665E">Glossary.md + _Glossary.md (213-tok prompt)</text>
    <text x="326" y="265" font-size="11.5" fill="#6E665E">_Voices.json cross-recording name match</text>

    <rect x="596" y="206" width="260" height="80" rx="12" fill="#F3EEE5" stroke="#E4DDD2"/>
    <text x="610" y="229" font-size="12.5" font-weight="600" fill="#292522">Non-Destructive Revisions</text>
    <text x="610" y="248" font-size="11.5" fill="#6E665E">Renames relabel notes without AI calls</text>
    <text x="610" y="265" font-size="11.5" fill="#6E665E">Regen saves (your edit N).md backups</text>
  </g>
</svg>
