<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaud dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /* Warm Studio: warm paper neutrals + one terracotta accent; the accent also marks errors */
  :root { --bg:oklch(0.972 0.008 80); --card:oklch(0.993 0.004 85); --sunk:oklch(0.955 0.01 80); --line:oklch(0.90 0.012 80);
    --ink:oklch(0.22 0.012 60); --mute:oklch(0.48 0.015 60); --primary:oklch(0.24 0.012 60); --on-primary:oklch(0.98 0.006 85);
    --acc:oklch(0.52 0.15 38); --acc-soft:oklch(0.945 0.03 45); --bad:var(--acc);
    --s1:oklch(0.42 0.12 38); --s2:oklch(0.60 0.14 42); --s3:oklch(0.70 0.10 50); --s4:oklch(0.80 0.06 55);
    --shadow:0 1px 2px oklch(0.3 0.03 60 / .05), 0 6px 20px oklch(0.3 0.03 60 / .05);
    --serif:"Iowan Old Style", Charter, Cambria, Georgia, serif; color-scheme:light dark; }
  :root[data-theme="dark"] { --bg:oklch(0.18 0.008 60); --card:oklch(0.215 0.009 60); --sunk:oklch(0.195 0.008 60); --line:oklch(0.31 0.01 60);
    --ink:oklch(0.93 0.01 80); --mute:oklch(0.71 0.013 70); --primary:oklch(0.92 0.01 80); --on-primary:oklch(0.19 0.008 60);
    --acc:oklch(0.76 0.12 45); --acc-soft:oklch(0.30 0.05 42);
    --s1:oklch(0.88 0.06 55); --s2:oklch(0.76 0.12 45); --s3:oklch(0.62 0.12 40); --s4:oklch(0.48 0.08 38);
    --shadow:0 1px 2px oklch(0 0 0 / .3); color-scheme:dark; }
  :root[data-theme="light"] { color-scheme:light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:oklch(0.18 0.008 60); --card:oklch(0.215 0.009 60); --sunk:oklch(0.195 0.008 60); --line:oklch(0.31 0.01 60);
    --ink:oklch(0.93 0.01 80); --mute:oklch(0.71 0.013 70); --primary:oklch(0.92 0.01 80); --on-primary:oklch(0.19 0.008 60);
    --acc:oklch(0.76 0.12 45); --acc-soft:oklch(0.30 0.05 42);
    --s1:oklch(0.88 0.06 55); --s2:oklch(0.76 0.12 45); --s3:oklch(0.62 0.12 40); --s4:oklch(0.48 0.08 38);
    --shadow:0 1px 2px oklch(0 0 0 / .3); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--acc-soft); color:var(--ink); }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  svg.i { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .mute { color:var(--mute); font-weight:400; } .num { font-variant-numeric:tabular-nums; }
  .label { font-size:12.5px; font-weight:600; color:var(--mute); }
  .err { color:var(--bad); }
  .emoji { font-family:"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-weight:400; }
  select, input, button { font:inherit; font-size:13.5px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:9px; height:34px; padding:0 10px; }
  input.n { width:60px; } input.name { width:140px; }
  button { cursor:pointer; font-weight:550; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:background .15s, filter .15s; }
  button:hover { background:var(--sunk); }
  button.ghost { background:transparent; }
  button.quiet { border-color:transparent; background:transparent; color:var(--mute); padding:0 8px; }
  button.quiet:hover { color:var(--ink); background:var(--sunk); }
  /* one filled button per row: the main action */
  button.primary { background:var(--primary); color:var(--on-primary); border-color:transparent; }
  button.primary:hover { filter:brightness(1.12); background:var(--primary); }
  button.link { height:auto; padding:0; border:0; background:none; font-weight:550; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
  button.link:hover { background:none; text-decoration-color:currentColor; }
  button:disabled { opacity:.4; cursor:default; filter:none; }
  .pill { display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 8px; border-radius:99px; background:var(--sunk); font-size:11.5px; font-weight:600; color:var(--mute); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pill.attn { background:var(--acc-soft); color:var(--acc); }
  .pill.bad { background:var(--bad); color:var(--bg); }
  a { color:var(--ink); text-decoration-color:var(--line); text-underline-offset:3px; } a:hover { text-decoration-color:currentColor; }
  .stack { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  /* top bar */
  header.top { display:flex; align-items:center; gap:12px; padding:10px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; background:var(--bg); }
  .brand { font:500 20px/1 var(--serif); }
  #status { margin-left:auto; color:var(--mute); font-size:13px; display:flex; align-items:center; gap:6px; min-width:0; }
  #status > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #jobs-btn { position:relative; overflow:hidden; border-radius:99px; height:30px; padding:0 11px; gap:7px; }
  .jbtn-bar { position:absolute; left:0; bottom:0; height:2px; background:var(--acc); transition:width .55s cubic-bezier(.22,1,.36,1); pointer-events:none; }
  #theme-btn { width:32px; height:32px; padding:0; justify-content:center; border-radius:99px; flex:none; font-size:18px; color:var(--mute); }
  #theme-btn:hover { background:var(--sunk); color:var(--ink); }
  /* toggles.dev/toggles/around */
  .theme-toggle { --theme-toggle__around--duration:500ms; border:none; background:none; cursor:pointer; }
  .theme-toggle__around circle { transform-origin:center; transition-property:transform; transition-timing-function:cubic-bezier(0,0,.15,1.25); }
  .theme-toggle__around > g > circle { transition-duration:calc(var(--theme-toggle__around--duration) * .4); }
  .theme-toggle__around > g g circle { transform-box:fill-box; transition-duration:calc(var(--theme-toggle__around--duration) * .2); }
  .theme-toggle__around > g g :nth-child(1) { transition-delay:calc(var(--theme-toggle__around--duration) * .25); }
  .theme-toggle__around > g g :nth-child(2) { transition-delay:calc(var(--theme-toggle__around--duration) * .39); }
  .theme-toggle__around > g g :nth-child(3) { transition-delay:calc(var(--theme-toggle__around--duration) * .53); }
  .theme-toggle__around > g g :nth-child(4) { transition-delay:calc(var(--theme-toggle__around--duration) * .67); }
  .theme-toggle__around > g g :nth-child(5) { transition-delay:calc(var(--theme-toggle__around--duration) * .81); }
  .theme-toggle__around > g g :nth-child(6) { transition-delay:calc(var(--theme-toggle__around--duration) * .95); }
  .theme-toggle__around > *:first-child { transition:transform calc(var(--theme-toggle__around--duration) * .4) cubic-bezier(0,0,.15,1.25); transform-origin:center; }
  .theme-toggle__around > *:first-child path { transition-property:transform, d; transition-duration:calc(var(--theme-toggle__around--duration) * .4); transition-timing-function:cubic-bezier(0,0,.15,1.25); }
  .theme-toggle--toggled .theme-toggle__around > g > circle { transform:scale(1.4); transition-delay:calc(var(--theme-toggle__around--duration) * .6); }
  .theme-toggle--toggled .theme-toggle__around > g g circle { transform:scale(0); }
  .theme-toggle--toggled .theme-toggle__around > g g :nth-child(1) { transition-delay:calc(var(--theme-toggle__around--duration) * 0); }
  .theme-toggle--toggled .theme-toggle__around > g g :nth-child(2) { transition-delay:calc(var(--theme-toggle__around--duration) * .14); }
  .theme-toggle--toggled .theme-toggle__around > g g :nth-child(3) { transition-delay:calc(var(--theme-toggle__around--duration) * .28); }
  .theme-toggle--toggled .theme-toggle__around > g g :nth-child(4) { transition-delay:calc(var(--theme-toggle__around--duration) * .42); }
  .theme-toggle--toggled .theme-toggle__around > g g :nth-child(5) { transition-delay:calc(var(--theme-toggle__around--duration) * .56); }
  .theme-toggle--toggled .theme-toggle__around > g g :nth-child(6) { transition-delay:calc(var(--theme-toggle__around--duration) * .7); }
  .theme-toggle--toggled .theme-toggle__around > *:first-child { transform:rotate(-90deg); transition-delay:calc(var(--theme-toggle__around--duration) * .7); }
  .theme-toggle--toggled .theme-toggle__around > *:first-child path { d:path("M-12-14h42v30a1 1 0 00-16 13H0Z"); transition-delay:calc(var(--theme-toggle__around--duration) * .7); }
  @supports not (d: path("")) { .theme-toggle--toggled .theme-toggle__around > *:first-child path { transform:translate3d(-12px,-14px,0); } }

  /* loading-ui.com Spiral + minimal progress bar & stage stepper */
  .spiral { position:relative; display:inline-block; width:14px; height:14px; flex:none; color:var(--acc); }
  .spiral.sm { width:11px; height:11px; }
  .spiral.lg { width:18px; height:18px; }
  .spiral i { position:absolute; width:18.75%; height:18.75%; border-radius:50%; background:currentColor; transform:translate(-50%,-50%) scale(0); opacity:0; animation:spiral-dot 1.5s ease-in-out infinite; }
  .spiral i:nth-child(1) { left:81.25%; top:50%; animation-delay:-1.5s; }
  .spiral i:nth-child(2) { left:72.1%; top:72.1%; animation-delay:-1.3125s; }
  .spiral i:nth-child(3) { left:50%; top:81.25%; animation-delay:-1.125s; }
  .spiral i:nth-child(4) { left:27.9%; top:72.1%; animation-delay:-.9375s; }
  .spiral i:nth-child(5) { left:18.75%; top:50%; animation-delay:-.75s; }
  .spiral i:nth-child(6) { left:27.9%; top:27.9%; animation-delay:-.5625s; }
  .spiral i:nth-child(7) { left:50%; top:18.75%; animation-delay:-.375s; }
  .spiral i:nth-child(8) { left:72.1%; top:27.9%; animation-delay:-.1875s; }
  @keyframes spiral-dot { 0%, 100% { transform:translate(-50%,-50%) scale(0); opacity:0; } 50% { transform:translate(-50%,-50%) scale(1); opacity:1; } }

  .pbar { position:relative; height:6px; border-radius:99px; background:var(--sunk); overflow:hidden; }
  .pbar-fill { position:relative; height:100%; min-width:6px; border-radius:99px; background:linear-gradient(90deg, color-mix(in oklch, var(--acc) 82%, var(--primary) 18%), var(--acc)); transition:width .55s cubic-bezier(.22,1,.36,1); overflow:hidden; }
  .pbar-fill::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent, oklch(1 0 0 / .42), transparent); transform:translateX(-100%); animation:pbar-shimmer 1.8s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes pbar-shimmer { 100% { transform:translateX(100%); } }

  .psteps { display:flex; align-items:center; gap:5px 10px; flex-wrap:wrap; font-size:11.5px; color:var(--mute); }
  .pstep { display:inline-flex; align-items:center; gap:4px; transition:color .2s; }
  .pstep::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--line); flex:none; }
  .pstep.done { color:var(--ink); opacity:.72; }
  .pstep.done::before { background:var(--ink); }
  .pstep.now { color:var(--acc); font-weight:650; }
  .pstep.now::before { background:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); }
  .qdot { width:7px; height:7px; border-radius:50%; background:var(--acc); opacity:.55; animation:qdot 1.8s ease-in-out infinite; flex:none; }
  @keyframes qdot { 0%, 100% { transform:scale(.85); opacity:.4; } 50% { transform:scale(1.15); opacity:.95; } }

  #jobs-pop { position:absolute; right:20px; top:52px; width:min(480px, calc(100vw - 32px)); padding:10px 16px; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); z-index:25; }
  #jobs > * + * { border-top:1px solid var(--line); }
  .jrow { font-size:13.5px; padding:9px 0; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .jrow-main { display:flex; align-items:center; gap:7px; min-width:0; flex:1; flex-wrap:wrap; }
  .jcard { padding:10px 0; display:grid; gap:8px; }
  .jcard-top { display:flex; align-items:center; gap:8px; min-width:0; }
  .jcard-title { font-size:13.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .jcard-pct { font-size:13px; font-weight:650; color:var(--acc); flex:none; }
  .jcard-meta { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; color:var(--mute); }
  .jcard-status { display:inline-flex; align-items:center; gap:6px; min-width:0; overflow:hidden; }
  .jcard-msg { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .jcard-eta { flex:none; font-weight:550; color:var(--ink); }

  .job-banner { margin:14px 0 2px; padding:12px 14px; border-radius:12px; border:1px solid color-mix(in oklch, var(--acc) 26%, var(--line)); background:linear-gradient(135deg, color-mix(in oklch, var(--acc-soft) 58%, var(--card)), var(--card)); display:grid; gap:9px; }
  .job-banner.queued { grid-template-columns:auto 1fr; align-items:center; gap:10px; padding:10px 14px; border-style:dashed; border-color:var(--line); background:var(--sunk); }
  .jb-top { display:flex; align-items:center; gap:10px; min-width:0; }
  .jb-copy { flex:1; min-width:0; }
  .jb-title { font-size:13.5px; font-weight:600; color:var(--ink); }
  .jb-sub { font-size:12px; color:var(--mute); display:flex; align-items:center; gap:6px; margin-top:2px; min-width:0; }
  .jb-sub > span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .jb-stat { text-align:right; flex:none; }
  .jb-stat b { display:block; font-size:14.5px; font-weight:650; color:var(--acc); line-height:1.15; }
  .jb-stat span { font-size:11.5px; color:var(--mute); }
  @media (prefers-reduced-motion: reduce) {
    .theme-toggle, .theme-toggle * { transition-duration:.01ms !important; transition-delay:0s !important; }
    .spiral i, .pbar-fill::after, .qdot { animation:none !important; }
    .spiral i { transform:translate(-50%,-50%) scale(.75); opacity:.7; }
  }
  .running, .paused { color:var(--acc); } .done { color:var(--mute); } .failed { color:var(--bad); font-weight:550; }
  #auth { margin:12px 20px 0; padding:10px 14px; border-radius:10px; background:var(--acc-soft); }
  #menu { display:none; }
  .ai { height:30px; border-radius:99px; gap:7px; font-size:13px; }
  .ai .d, .prow .d { width:8px; height:8px; border-radius:50%; background:var(--c, var(--mute)); flex:none; }
  .prow { display:grid; gap:6px; font-size:13.5px; }
  .prow + .prow { border-top:1px solid var(--line); padding-top:10px; }
  .prow-head { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; }
  .prow-sub { display:flex; gap:6px; align-items:center; padding-left:18px; }
  .prow-sub select, .prow-sub input { flex:1; min-width:0; height:30px; font-size:12.5px; }
  .prow-sub button { height:30px; font-size:12.5px; }
  .prow-sub[hidden] { display:none; }

  /* left column */
  .shell { display:grid; grid-template-columns:284px 1fr; min-height:calc(100vh - 52px); }
  nav.rail { border-right:1px solid var(--line); padding:14px 10px 40px; position:sticky; top:53px; align-self:start; max-height:calc(100vh - 53px); overflow-y:auto; }
  .search { display:flex; align-items:center; gap:4px; background:var(--sunk); border-radius:10px; padding:0 4px 0 10px; margin:0 2px 4px; color:var(--mute); }
  .search input { flex:1; border:0; background:transparent; min-width:0; padding:0 4px; }
  .search input:focus { outline:none; }
  .hint { font-size:12px; color:var(--mute); margin:0 12px 6px; }
  .sect { font-size:11.5px; font-weight:700; color:var(--mute); margin:16px 6px 4px 12px; display:flex; justify-content:space-between; align-items:center; }
  .sect button { height:26px; font-size:12px; }
  .entry { width:100%; justify-content:flex-start; padding:7px 10px; border:0; background:none; text-align:left; height:auto; font-weight:400; }
  .entry b { font-weight:550; flex:1; overflow:hidden; text-overflow:ellipsis; } .entry .c { color:var(--mute); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .entry.sel { background:var(--card); box-shadow:var(--shadow); outline:1px solid var(--line); }
  .entry .chev { transition:transform .15s; color:var(--mute); }
  .entry[aria-expanded=true] .chev { transform:rotate(90deg); }
  .entry.drop { background:var(--acc-soft); outline:2px dashed var(--acc); outline-offset:-2px; }
  .recs { padding:2px 0 8px 12px; margin-left:16px; border-left:1px solid var(--line); }
  .rec { display:block; width:100%; height:auto; padding:7px 10px; border:0; border-radius:9px; background:none; text-align:left; font-weight:400; white-space:normal; cursor:pointer; }
  .rec:hover { background:none; }
  .rec.dragging { opacity:.4; }
  .rec.on, .rec.on:hover { background:var(--acc-soft); }
  .rec .t { font-size:13.5px; font-weight:550; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .rec .m { color:var(--mute); font-size:12px; margin-top:2px; display:flex; gap:4px 8px; align-items:center; flex-wrap:wrap; }
  .gloss { font-size:12px; color:var(--mute); padding:2px 10px 6px; }
  .newf { display:flex; gap:6px; margin:2px 4px 6px 12px; } .newf input { flex:1; min-width:0; height:30px; }
  mark { background:var(--acc-soft); color:inherit; border-radius:3px; padding:0 1px; }

  /* recording view */
  .view { padding:24px 36px 80px; min-width:0; }
  .empty { color:var(--mute); padding:60px 0; text-align:center; }
  .r-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
  h1 { font:500 26px/1.25 var(--serif); margin:0; letter-spacing:-.01em; max-width:44ch; overflow-wrap:anywhere; }
  .meta { display:flex; gap:4px 14px; flex-wrap:wrap; color:var(--mute); font-size:13px; margin-top:6px; }
  .pillbtn { flex:none; border-radius:99px; }
  .title-in { display:block; width:100%; font:inherit; letter-spacing:inherit; color:inherit; background:transparent;
    border:1px solid transparent; border-radius:6px; padding:0 4px; margin-left:-5px; resize:none; overflow:hidden; cursor:text; }
  .title-in:hover { background:var(--sunk); }
  .title-in:focus { outline:none; border-color:var(--line); background:var(--sunk); }
  .strip { position:relative; height:8px; border-radius:99px; overflow:hidden; margin:18px 0 6px; background:var(--sunk); }
  .strip i { position:absolute; top:0; bottom:0; }
  /* speakers: click a name in the legend or on a passage to fix it */
  .legend { display:flex; gap:2px 4px; flex-wrap:wrap; margin-left:-10px; }
  .who-btn { height:30px; padding:0 10px; border-radius:99px; border:1px solid transparent; background:transparent; font-size:13px; font-weight:500; gap:7px; }
  .who-btn::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--c, var(--mute)); flex:none; }
  .who-btn.plain::before { display:none; }
  .who-btn .t { color:var(--mute); font-size:12px; font-weight:400; } .who-btn .v { color:var(--mute); font-size:10px; }
  .who-btn:hover, .who-btn[aria-expanded=true] { background:var(--sunk); border-color:var(--line); }
  .ask { display:flex; gap:10px 12px; align-items:center; flex-wrap:wrap; margin:0 0 14px; padding:12px 16px; background:var(--acc-soft); border-radius:12px; font-size:14px; }
  .ask b { font-weight:650; } .ask .of { margin-left:auto; font-size:12px; color:var(--mute); }
  .pop { position:absolute; z-index:30; width:min(300px, calc(100vw - 16px)); padding:14px; display:grid; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
  .pop[hidden] { display:none; }
  .pop .row { display:flex; gap:8px; align-items:center; } .pop .row > :first-child { flex:1; min-width:0; }
  .pop .lbl { font-size:12px; color:var(--mute); }
  .pop.menu { width:220px; padding:6px; gap:0; }
  .pop.wide { width:min(380px, calc(100vw - 16px)); }
  .mwrap[hidden] { display:none; }
  .mi { width:100%; justify-content:flex-start; border:0; background:none; font-weight:400; height:32px; }
  .mi::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--c); flex:none; } .mi.plain::before { display:none; }
  .moved { font-size:12px; color:var(--mute); margin-top:4px; }
  .tabs { display:flex; align-items:flex-end; gap:16px; border-bottom:1px solid var(--line); margin:22px 0 0; }
  .tab { padding:10px 12px; border:0; border-bottom:2px solid transparent; border-radius:0; margin-bottom:-1px; background:none; color:var(--mute); height:auto; flex:none; }
  .tab:hover { color:var(--ink); background:none; }
  .tab[aria-selected=true] { color:var(--ink); border-bottom-color:var(--ink); }

        <circle cx="16" cy="16" r="8.4"/>

          <circle cx="16" cy="3.3" r="2.3"/>

          <circle cx="27" cy="22.3" r="2.3"/>

<script>
let S = null, last = "", force = false, stateAt = Date.now();
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const opts = (list, sel) => list.map(x => `<option${x === sel ? " selected" : ""}>${esc(x)}</option>`).join("");
const obs = (path) => `obsidian://open?vault=${encodeURIComponent(S.vault)}&file=${encodeURIComponent(path)}`;
const ic = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const chev = `<svg class="i chev"><use href="#i-chev"/></svg>`;
async function post(url, body) {
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  document.getElementById("err").textContent = r.ok ? "" : (data.detail || "Request failed");
  if (!r.ok) { alert(data.detail || "Request failed"); return null; }
  if (body.id) forget(body.id);
  if (data.merge_offer) {
    const [src, dst] = data.merge_offer;
    if (confirm(`Merge Speaker ${src.slice(1)} into Speaker ${dst.slice(1)}?`)) await post("/api/merge", {id:body.id, src, dst});
  }
  force = true; load();
  return data;
}
function busy(id) { return S.jobs.some(j => j.rec_id === id && ["queued", "running", "paused"].includes(j.status)); }

// ---- what is selected: kept per viewer, survives reloads ----
const UI = (() => { try { return JSON.parse(localStorage.getItem("plaud-ui")) || {}; } catch { return {}; } })();
UI.scope ??= "all"; UI.tab ??= "transcript";
const keep = () => { try { localStorage.setItem("plaud-ui", JSON.stringify(UI)); } catch {} };
const themeBtn = document.getElementById("theme-btn");
const isDark = () => UI.theme ? UI.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function applyTheme() {
  if (UI.theme) document.documentElement.dataset.theme = UI.theme;
  else delete document.documentElement.dataset.theme;
  const dark = isDark();
  themeBtn.classList.toggle("theme-toggle--toggled", dark);
  themeBtn.setAttribute("aria-pressed", String(dark));
  themeBtn.title = dark ? "Switch to light mode" : "Switch to dark mode";
  themeBtn.setAttribute("aria-label", themeBtn.title);
}
applyTheme();
themeBtn.onclick = () => { UI.theme = isDark() ? "light" : "dark"; keep(); applyTheme(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!UI.theme) applyTheme(); });
const pendingFolders = new Set();   // created in the page; saved in the vault when the first recording is moved in
let addingFolder = false, query = "";
const time = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
const stripProvider = (r, n) => {
  const raw = n.file.slice(0, -3).replace(r.stem + " - ", "");
  return n.provider ? raw.replace(new RegExp(` \\(${n.provider.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\)(?=$| \\d+$)`), "") : raw;
};
const noteLabel = (r, n) => {
  const clean = stripProvider(r, n);
  return r.notes.filter(x => stripProvider(r, x) === clean).length > 1
    ? n.file.slice(0, -3).replace(r.stem + " - ", "") : clean;
};
const recOf = id => S.recordings.find(r => r.id === id);
const lastJob = id => S.jobs.find(j => j.rec_id === id);
const liveJob = id => S?.jobs.find(j => j.rec_id === id && ["running", "queued", "paused"].includes(j.status));
const spiral = (cls = "") => `<span class="spiral${cls ? " " + cls : ""}" aria-hidden="true">${"<i></i>".repeat(8)}</span>`;
const JOB_KINDS = { import:"Importing", import_plaud:"Plaud import", resume:"Resuming", retranscribe:"Transcribing", respeak:"Speakers", generate:"Writing note", regenerate:"Regenerating", check_providers:"Checking AI", move:"Moving" };
const kindLabel = k => JOB_KINDS[k] || k;
const fmtEta = s => s < 60 ? `~${s}s` : s < 3600 ? `~${Math.floor(s/60)}m ${String(s%60).padStart(2,"0")}s` : `~${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
const fmtClock = s => s < 3600 ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}` : `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function liveProgress(j) {
  const p = j?.progress;
  if (!p) return null;
  // only the clock moves between polls; the bar shows what the server measured
  const dt = Math.max(0, (Date.now() - stateAt) / 1000);
  return { ...p, eta_s: Math.max(1, Math.round(p.eta_s - dt)), elapsed_s: Math.round(p.elapsed_s + dt) };
}
const etaText = p => p.overdue ? "longer than usual" : `${fmtEta(p.eta_s)} left`;
function stepperHtml(p) {
  if (!p?.stages || p.stages.length < 2) return "";
  return `<div class="psteps">${p.stages.map((s, i) => {
    const cls = i + 1 < p.step ? "done" : i + 1 === p.step ? "now" : "todo";
    return `<span class="pstep ${cls}" data-step-idx="${i}">${esc(s)}</span>`;
  }).join("")}</div>`;
}
function jobBannerHtml(j) {
  if (j.status === "queued") {
    return `<div class="job-banner queued" data-job-banner="${j.id}">${spiral("sm")}<div><div class="jb-title">${esc(kindLabel(j.kind))} · queued</div><div class="mute" style="font-size:12px">Waiting for the current job to finish…</div></div></div>`;
  }
  const p = liveProgress(j) || { pct: 5, eta_s: 15, elapsed_s: 0, stage_label: "Working", step: 1, steps: 1, stages: [] };
  return `<div class="job-banner" data-job-banner="${j.id}">
    <div class="jb-top">
      ${spiral("lg")}
      <div class="jb-copy">
        <div class="jb-title">${esc(kindLabel(j.kind))}${p.stage_label ? ` · <span class="jb-stage">${esc(p.stage_label)}</span>` : ""}</div>
        <div class="jb-sub"><span class="jb-msg">${esc(j.msg || "Starting…")}</span></div>
      </div>
      <div class="jb-stat num"><b class="jb-pct">${Math.round(p.pct)}%</b><span class="jb-eta">${etaText(p)}</span></div>
    </div>
    <div class="pbar"><div class="pbar-fill" style="width:${p.pct}%"></div></div>
    ${stepperHtml(p)}
  </div>`;
}

// ---- search: titles at once; transcripts and notes once loaded ----
// ponytail: loads each recording's detail and notes into the page on first search; a server-side index if the vault grows past a few hundred recordings
const textIndex = {};
async function indexRecording(r) {
  const key = r.id + JSON.stringify(r.notes.map(n => n.file + n.at)) + (r.model || "");
  if (textIndex[r.id]?.key === key) return;
  textIndex[r.id] = { key, text: "" };
  try {
    const d = await (await fetch(`/api/recordings/${r.id}`)).json();
    const parts = [...(d.utterances || []).map(u => u.text), ...(d.marks || []).map(m => m.text)];
    for (const n of r.notes.filter(n => !n.missing)) {
      const res = await fetch(`/api/notes/${r.id}/${encodeURIComponent(n.file)}`);
      if (res.ok) parts.push((await res.json()).text);
    }
    textIndex[r.id].text = parts.join("\n").toLowerCase();
  } catch { delete textIndex[r.id]; }
}
const hits = (r, q) => q ? (textIndex[r.id]?.text.split(q).length - 1 || 0) : 0;
const titleHit = (r, q) => !q || r.title.toLowerCase().includes(q);
const hi = s => {   // highlight before escaping, so a search never lands inside an HTML entity
  s = String(s ?? ""); if (!query) return esc(s);
  const low = s.toLowerCase(); let out = "", i = 0, j;
  while ((j = low.indexOf(query, i)) >= 0) { out += esc(s.slice(i, j)) + "<mark>" + esc(s.slice(j, j + query.length)) + "</mark>"; i = j + query.length; }
  return out + esc(s.slice(i));
};
let searchTimer = null;
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  renderRail();
  searchTimer = setTimeout(async () => {
    if (!query) return;
    await Promise.all(inScope().map(indexRecording));
    renderRail(); renderView();
  }, 300);
});
function inScope() {
  if (UI.scope === "ni") return [];
  return UI.scope === "all" || !UI.scope ? S.recordings : S.recordings.filter(r => r.group === UI.scope);
}

// ---- left column ----
function recItem(r, showFolder) {
  const job = liveJob(r.id) || lastJob(r.id), n = hits(r, query);
  const lp = job?.status === "running" ? liveProgress(job) : null;
  const badge = job?.status === "failed" ? `<span class="pill bad">failed</span>`
    : busy(r.id) ? `<span class="pill attn">${spiral("sm")}<span data-job-pct="${job.id}">${lp ? `${Math.round(lp.pct)}%` : "working"}</span></span>`
    : r.notes.some(x => x.state === "out_of_date") ? `<span class="pill attn">note out of date</span>` : "";
  return `<div class="rec${r.id === UI.rec ? " on" : ""}" role="button" tabindex="0" draggable="true" data-rec="${r.id}">
    <div class="t">${hi(r.title)}</div>
    <div class="m num"><span>${esc(r.date)}</span><span>${esc(r.duration)}</span>${showFolder ? `<span>${ic("folder")} ${esc(r.group)}</span>` : ""}${badge}${n ? `<span>${n} match${n === 1 ? "" : "es"} inside</span>` : ""}</div></div>`;
}
function renderRail() {
  const groups = [...new Set([...S.groups, ...[...pendingFolders].filter(f => !S.groups.includes(f))])];
  const match = r => titleHit(r, query) || hits(r, query) > 0;
  const scopeName = UI.scope === "all" ? "all recordings" : UI.scope === "ni" ? "not imported" : UI.scope || "all recordings";
  document.getElementById("q").placeholder = `Search in ${scopeName}`;
  document.getElementById("q-hint").innerHTML = query ? `Titles, transcripts and notes in <b style="color:var(--ink);font-weight:600">${esc(scopeName)}</b>` : "Searches what is selected below";
  const all = S.recordings.filter(match), ni = S.not_imported.filter(r => !query || r.title.toLowerCase().includes(query));
  const count = (shown, total, open) => `${query && open ? shown + " of " : ""}${total}`;
  const rail = document.getElementById("rail");
  rail.innerHTML = `<div class="sect">Library</div>
    <button class="entry${UI.scope === "all" ? " sel" : ""}" data-scope="all" aria-expanded="${UI.scope === "all"}">${ic("stack")}<b>All recordings</b><span class="c">${count(all.length, S.recordings.length, UI.scope === "all")}</span></button>
    ${UI.scope === "all" ? `<div class="recs">${all.map(r => recItem(r, true)).join("") || `<div class="gloss">${S.recordings.length ? "No match" : "No recordings yet"}</div>`}</div>` : ""}
    <button class="entry${UI.scope === "ni" ? " sel" : ""}" data-scope="ni" aria-expanded="${UI.scope === "ni"}">${ic("cloud")}<b>Not imported yet</b><span class="c">${count(ni.length, S.not_imported.length, UI.scope === "ni")}</span></button>
    ${UI.scope === "ni" ? `<div class="recs">${S.plaud_error ? `<div class="gloss err">Plaud: ${esc(S.plaud_error)}</div>` : ""}
      ${ni.map(r => { const j = liveJob(r.id), lp = j?.status === "running" ? liveProgress(j) : null; return `<button class="rec${r.id === UI.rec ? " on" : ""}" data-ni="${r.id}"><div class="t">${hi(r.title)}</div><div class="m num"><span>${esc(r.date)}</span><span>${esc(r.duration)}</span>${busy(r.id) ? `<span class="pill attn">${spiral("sm")}<span data-job-pct="${j.id}">${lp ? `${Math.round(lp.pct)}%` : "importing"}</span></span>` : ""}</div></button>`; }).join("") || `<div class="gloss">Nothing waiting</div>`}
      <button class="rec mute" id="rf" style="font-size:12.5px;display:flex;gap:6px;align-items:center">${ic("refresh")}Refresh</button></div>` : ""}
    <div class="sect">Folders <button class="quiet" id="new-folder">${ic("plus")}New folder</button></div>
    ${addingFolder ? `<div class="newf"><input id="new-folder-name" placeholder="Folder name" aria-label="New folder name"><button class="primary" id="new-folder-ok">Create</button></div>` : ""}
    ${groups.map(g => {
      const open = UI.scope === g, recs = S.recordings.filter(r => r.group === g), shown = recs.filter(match);
      return `<button class="entry${open ? " sel" : ""}" data-scope="${esc(g)}" data-drop="${esc(g)}" aria-expanded="${open}">${chev}<b>${esc(g)}</b><span class="c">${count(shown.length, recs.length, open)}</span></button>
        ${open ? `<div class="recs">${shown.map(r => recItem(r, false)).join("") || `<div class="gloss">${recs.length ? "No match in this folder" : "Empty. Drag a recording here."}</div>`}</div>` : ""}`;
    }).join("")}
    <div class="gloss" style="margin-top:8px">Drag a recording onto a folder to move it.</div>`;
  rail.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => { UI.scope = UI.scope === b.dataset.scope ? "" : b.dataset.scope; keep(); renderRail(); if (query) document.getElementById("q").dispatchEvent(new Event("input")); });
  rail.querySelectorAll("[data-rec]").forEach(b => {
    b.onclick = () => select(b.dataset.rec);
    b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(b.dataset.rec); } };
    b.ondragstart = e => { e.dataTransfer.setData("text/plain", b.dataset.rec); b.classList.add("dragging"); };
    b.ondragend = () => b.classList.remove("dragging");
  });
  rail.querySelectorAll("[data-ni]").forEach(b => b.onclick = () => select(b.dataset.ni));
  rail.querySelectorAll("[data-drop]").forEach(f => {
    f.ondragover = e => { e.preventDefault(); f.classList.add("drop"); };
    f.ondragleave = () => f.classList.remove("drop");
    f.ondrop = e => {
      e.preventDefault(); f.classList.remove("drop");
      const r = recOf(e.dataTransfer.getData("text/plain")), g = f.dataset.drop;
      if (r && r.group !== g) post("/api/move", { id:r.id, group:g });
    };
  });
  document.getElementById("rf")?.addEventListener("click", () => { for (const k of Object.keys(plaudDetails)) delete plaudDetails[k]; post("/api/refresh", {}); });
  document.getElementById("new-folder").onclick = () => { addingFolder = !addingFolder; renderRail(); document.getElementById("new-folder-name")?.focus(); };
  const make = () => {
    const name = document.getElementById("new-folder-name").value.trim();
    if (name) { pendingFolders.add(name); UI.scope = name; keep(); }
    addingFolder = false; renderRail();
  };
  document.getElementById("new-folder-ok")?.addEventListener("click", make);
  document.getElementById("new-folder-name")?.addEventListener("keydown", e => { if (e.key === "Enter") make(); if (e.key === "Escape") { addingFolder = false; renderRail(); } });
}
function select(id) {
  if (UI.rec !== id) { UI.tab = "transcript"; filter = { spk: null, marks: false }; }
  UI.rec = id; keep();
  document.getElementById("shell").classList.remove("rail-open");
  renderRail(); renderView();
}

// ---- recording detail (transcript, speakers) ----
const details = {};
async function detail(r) {
  const key = JSON.stringify([r.model, r.speakers, r.notes.length, r.stage, r.true_speakers]);
  if (details[r.id]?.key !== key) {
    const res = await fetch(`/api/recordings/${r.id}`);
    details[r.id] = { key, data: res.ok ? await res.json() : null };
  }
  return details[r.id].data;
}
function speakerInfo(d) {
  const target = k => d.speakers[k]?.merged_into ? target(d.speakers[k].merged_into) : k;
  const name = k => d.speakers[target(k)]?.name || `Speaker ${target(k).slice(1)}`;
  const talk = {};
  for (const u of d.utterances) talk[target(u.spk)] = (talk[target(u.spk)] || 0) + u.e - u.s;
  const order = Object.keys(talk).sort((a, b) => talk[b] - talk[a]);
  const colour = k => `var(--s${Math.min(order.indexOf(target(k)) + 1, 4) || 4})`;
  return { target, name, talk, order, colour };
}
const notes = {};
// a change to a recording (an edit here, or one of its jobs finishing) drops what the page holds for it
function forget(id) {
  delete details[id]; delete textIndex[id];
  for (const k of Object.keys(notes)) if (k.startsWith(id)) delete notes[k];
}
async function noteText(r, n) {
  const key = r.id + n.file + n.at;
  if (!(key in notes)) {
    const res = await fetch(`/api/notes/${r.id}/${encodeURIComponent(n.file)}`);
    notes[key] = res.ok ? (await res.json()).text : null;
  }
  return notes[key];
}
// ponytail: small Markdown subset (headings, lists, bold, italic, code, wiki links); nested lists render flat
function md(src) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>").replace(/==([^=]+)==/g, "<mark>$1</mark>")
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => b || a)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1");
  const out = []; let list = null, code = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of src.split(/\r?\n/)) {
    if (code !== null) { if (/^\s*```/.test(line)) { out.push(`<pre>${esc(code)}</pre>`); code = null; } else code += line + "\n"; continue; }
    if (/^\s*```/.test(line)) { close(); code = ""; continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { close(); const h = Math.min(m[1].length + 1, 4); out.push(`<h${h}>${inline(m[2])}</h${h}>`); }
    else if ((m = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))) { const t = /\d/.test(m[1]) ? "ol" : "ul"; if (list !== t) { close(); out.push(`<${t}>`); list = t; } out.push(`<li>${inline(m[2])}</li>`); }
    else if (!line.trim()) close();
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close(); if (code !== null) out.push(`<pre>${esc(code)}</pre>`);
  return out.join("");
}

// ---- main view ----
const player = document.getElementById("player");
let playerRec = null, filter = { spk: null, marks: false };
async function renderView() {
  const view = document.getElementById("view");
  // park the player outside the redrawn area so a refresh never stops playback
  viewKey = viewState();
  if (popAnchor !== document.getElementById("ai-btn")) closePop();
  view.style.minHeight = view.offsetHeight + "px";   // hold the height while the transcript reloads, so the page doesn't jump to the top
  if (player.parentNode !== document.body) document.body.append(player);
  player.hidden = true;
  const r = recOf(UI.rec), pending = !r && S.not_imported.find(x => x.id === UI.rec);
  if (pending) { view.style.minHeight = ""; return renderImport(view, pending); }
  if (!r) { view.style.minHeight = "";
    view.innerHTML = `<div class="empty">${S.recordings.length ? "Choose a recording on the left." : "No recordings yet. New recordings in Plaud appear under “Not imported yet”."}</div>`;
    return;
  }
  const b = busy(r.id), activeJob = liveJob(r.id);
  const active = r.notes.findIndex(n => n.file === UI.tab);
  if (!["transcript", "glossary", "new"].includes(UI.tab) && active < 0) UI.tab = "transcript";
  view.innerHTML = `<div class="r-head"><div style="flex:1;min-width:0"><h1><textarea id="title-in" class="title-in" rows="1" spellcheck="false" aria-label="Recording title" title="Click to rename">${esc(r.title)}</textarea></h1>
      <div class="meta num"><span>${esc(r.date)} · ${esc(r.duration)}</span><span>${ic("folder")} ${esc(r.group)}</span><span>${esc(r.language || "?")}</span><span>${r.marks} highlights/memos</span>
        <span>${esc(r.model || "not transcribed")}${r.speaker_engine ? ` · speakers: ${esc(r.speaker_engine)}` : ""}</span>${b ? `<span class="pill attn">${spiral("sm")}working</span>` : ""}</div>
      ${r.error ? `<div class="err" style="margin-top:6px;font-size:13px">${esc(r.error)}</div>` : ""}</div>
    <div class="stack" style="flex:none;flex-wrap:nowrap"><button id="obs-btn" class="pillbtn">${ic("ext")} Obsidian</button>
      <button id="settings-btn" class="pillbtn" aria-haspopup="dialog"><span class="emoji">⚙️</span> Settings</button></div></div>
    ${activeJob && (activeJob.status === "running" || activeJob.status === "queued") ? `<div id="rec-job-slot">${jobBannerHtml(activeJob)}</div>` : ""}
    <div class="strip" id="strip" aria-hidden="true"></div><div class="legend num" id="legend"></div>

let queue = [], stopAt = null;
function nextSpan() {
  if (!queue.length) { if (stopAt !== null) player.pause(); stopAt = null; return; }
  const [s, e] = queue.shift(); stopAt = e; player.currentTime = s;
  player.play().catch(err => { document.getElementById("err").textContent = err.message; });
}
player.addEventListener("timeupdate", () => { if (stopAt !== null && player.currentTime >= stopAt) nextSpan(); });
function listen(d, sp, k) {
  if (playerRec !== UI.rec) { player.src = `/api/audio/${UI.rec}`; playerRec = UI.rec; }
  queue = d.utterances.filter(u => sp.target(u.spk) === k).sort((a, b) => (b.e - b.s) - (a.e - a.s)).slice(0, 3)
    .map(u => [u.s, u.e]).sort((a, b) => a[0] - b[0]);
  nextSpan();
}

// one small card or menu at a time, under what was clicked
const pop = document.getElementById("pop");
let popAnchor = null;
function openPop(anchor, html, cls) {
  if (popAnchor === anchor && !pop.hidden) return closePop();
  closePop();
  pop.className = "pop " + (cls || ""); pop.innerHTML = html; pop.hidden = false;
  popAnchor = anchor; anchor.setAttribute("aria-expanded", "true");
  const b = anchor.getBoundingClientRect();
  pop.style.left = Math.max(scrollX + 8, Math.min(b.left + scrollX, scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8)) + "px";
  pop.style.top = b.bottom + scrollY + 6 + "px";
}
function closePop() { pop.hidden = true; popAnchor?.setAttribute("aria-expanded", "false"); popAnchor = null; }
document.addEventListener("click", e => { if (!pop.hidden && !pop.contains(e.target) && !popAnchor?.contains(e.target)) closePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden) { const a = popAnchor; closePop(); a?.focus(); } });

function speakerCard(anchor, d, sp, k) {
  const label = j => d.speakers[j]?.name || `Speaker ${j.slice(1)}`;
  const others = sp.order.filter(j => j !== k);
  const joined = Object.keys(d.speakers).filter(j => d.speakers[j].merged_into && sp.target(j) === k);
  openPop(anchor, `<div class="row"><input class="pname" value="${esc(d.speakers[k]?.name || "")}" placeholder="Name" aria-label="Name of ${esc(sp.name(k))}"><button class="primary" data-act="save">Save</button></div>
    <button data-act="listen">${ic("play")}Listen to ${esc(sp.name(k))}</button>
    ${others.length ? `<div><div class="lbl">Same person as</div><div class="row"><select class="pjoin" aria-label="Same person as"><option value="">Choose…</option>${others.map(j => `<option value="${j}">${esc(sp.name(j))}</option>`).join("")}</select><button data-act="join">Join</button></div></div>` : ""}
    ${joined.map(j => `<div class="lbl">${esc(label(j))} was joined here · <button class="link" data-unmerge="${j}">Undo</button></div>`).join("")}
    ${d.voice_people_needed ? `<div class="lbl">Name ${d.voice_people_needed} more ${d.voice_people_needed === 1 ? "person" : "people"} and voices get suggested across recordings.</div>` : ""}`);
  const input = pop.querySelector(".pname");
  const save = () => edit("speakers", { names:Object.fromEntries(Object.keys(d.speakers).map(j => [j, j === k ? input.value.trim() : d.speakers[j].name || ""])) });
  pop.querySelector("[data-act=save]").onclick = save;
  input.onkeydown = e => { if (e.key === "Enter") save(); };
  pop.querySelector("[data-act=listen]").onclick = () => listen(d, sp, k);
  pop.querySelector("[data-act=join]")?.addEventListener("click", () => { const dst = pop.querySelector(".pjoin").value; if (dst) edit("merge", { src:k, dst }); });
  pop.querySelectorAll("[data-unmerge]").forEach(b => b.onclick = () => edit("unmerge", { src:b.dataset.unmerge }));
  return input;
}

function passageMenu(anchor, d, sp, u) {
  const now = sp.target(u.spk);
  openPop(anchor, `<div class="lbl" style="padding:4px 10px 2px">Who says this?</div>
    ${activeSpeakers(d, sp).map(k => `<button class="mi" style="--c:${sp.colour(k)}" data-to="${k}">${esc(sp.name(k))}${k === now ? " ✓" : ""}</button>`).join("")}
    <button class="mi plain" data-to="new">${ic("plus")}Someone new</button>`, "menu");
  pop.querySelectorAll("[data-to]").forEach(b => b.onclick = () => { closePop(); if (b.dataset.to !== now) edit("fix", { s:u.s, e:u.e, spk:b.dataset.to }); });
}

// what still needs the owner, asked one at a time above the transcript
function questions(r, d, sp) {
  const total = Object.values(sp.talk).reduce((a, b) => a + b, 0), out = [];
  for (const k of sp.order)
    if ((sp.talk[k] < 30 || sp.talk[k] < total * .02) && !named(d, k)) out.push({ key:"short " + k, kind:"short", k });
  for (const [k, s] of Object.entries(d.suggestions || {}))
    if (d.speakers[k] && !d.speakers[k].merged_into) out.push({ key:`voice ${k} ${s.name}`, kind:"voice", k, s });
  if (sp.order.length && (!d.true_speakers || askCount === r.id)) out.push({ key:"count", kind:"count" });
  return out.filter(q => !skipped.has(r.id + q.key));
}
function renderAsk(box, r, d, sp, qs) {
  const q = qs[0], name = k => esc(sp.name(k));
  if (q.kind === "short") {
    const close = d.closest_voices?.[q.k] && sp.target(d.closest_voices[q.k]);
    const others = sp.order.filter(j => j !== q.k);
    box.innerHTML = `<span><span class="emoji">👂</span> <b>${name(q.k)} talks only ${spoken(sp.talk[q.k])}.</b> Is it really someone else?</span>
      <button data-act="listen">${ic("play")}Listen</button><button data-act="name">Yes, give a name</button>
      ${close && close !== q.k ? `<button class="primary" data-act="join" data-dst="${close}">No, it's ${name(close)}</button>`
        : others.length ? `<select data-act="pick" aria-label="Who it really is"><option value="">No, it's…</option>${others.map(j => `<option value="${j}">${name(j)}</option>`).join("")}</select>` : ""}`;
  } else if (q.kind === "voice") {
    box.innerHTML = `<span><span class="emoji">👂</span> <b>${name(q.k)} sounds like ${esc(q.s.name)}.</b></span>
      <button data-act="listen">${ic("play")}Listen</button><button class="primary" data-act="yes">Yes, it's ${esc(q.s.name)}</button><button data-act="no">No</button>`;
  } else {
    const n = sp.order.length;
    box.innerHTML = `<span><span class="emoji">👥</span> <b>${n} ${n === 1 ? "person" : "people"} found.</b> Is that right?</span>
      <button class="primary" data-act="yes">Yes</button><span class="stack">No, there are <input class="n" type="number" min="0" max="12" value="${d.true_speakers || n}" title="0 clears a confirmed number" aria-label="Real number of people"><button data-act="save">Save</button></span>
      <span class="mute" style="font-size:12.5px">To split the speakers again with a new number, use ⚙️ Settings › Redo speakers.</span>`;
  }
  box.insertAdjacentHTML("beforeend", `<span class="of">${qs.length > 1 ? `1 of ${qs.length} · ` : ""}<button class="link mute" data-act="skip">skip</button></span>`);
  const on = (act, fn) => box.querySelector(`[data-act=${act}]`)?.addEventListener(act === "pick" ? "change" : "click", fn);
  on("skip", () => { skipped.add(r.id + q.key); if (q.kind === "count") askCount = null; renderView(); });
  on("listen", () => listen(d, sp, q.k));
  on("name", e => { e.stopPropagation(); const b = document.querySelector(`[data-card="${q.k}"]`); if (b) speakerCard(b, d, sp, q.k).focus(); });
  on("join", e => edit("merge", { src:q.k, dst:e.currentTarget.dataset.dst }));
  on("pick", e => { if (e.target.value) edit("merge", { src:q.k, dst:e.target.value }); });
  if (q.kind === "voice") {
    on("yes", () => edit("suggestion", { spk:q.k, accept:true, name:q.s.name }));
    on("no", () => edit("suggestion", { spk:q.k, accept:false, name:q.s.name }));
  }
  if (q.kind === "count") {
    const done = n => { askCount = null; edit("speakers", { true_speakers:n }); };
    on("yes", () => done(sp.order.length));
    on("save", () => { const n = +box.querySelector("input").value; if (Number.isInteger(n) && n >= 0) done(n); });
  }
}

// ---- AI providers: a chip in the top bar opens the list (ticket 10, Part D) ----
const gone = c => c && (c.message === "not installed" || String(c.message || "").startsWith("missing "));

    const right = canKey
      ? `<span class="stack" style="gap:4px">${ready ? "✓" : ""}<button class="quiet" style="height:26px;font-size:12px" data-editkey="${esc(p)}">${pc.has_key ? "Change key" : "Add key"}</button></span>`

    const keyRow = canKey
      ? `<div class="prow-sub" data-keybox="${esc(p)}" hidden><input type="password" autocomplete="off" placeholder="${esc(pc.api_key_env)}" aria-label="${esc(p)} API key"><button class="primary" data-savekey="${esc(p)}">Save</button>${pc.has_key ? `<button class="quiet" data-clearkey="${esc(p)}">Clear</button>` : ""}</div>` : "";
    return `<div class="prow" style="--c:${colour}"><div class="prow-head"><span class="d"></span><span><b>${esc(p)}</b> · ${state}${why ? `<br><span class="lbl">${esc(why)}</span>` : ""}</span>${right}</div>${keyRow}</div>`;
  };
  openPop(e.currentTarget, `<div class="lbl">AI used to write notes</div>${names.map(row).join("") || `<div>No AI configured.</div>`}
    <button class="primary" data-act="check" style="justify-self:start"${checking() ? " disabled" : ""}>${ic("refresh")}${checking() ? "Checking…" : Object.keys(checks).length ? "Check again" : "Check now"}</button>`, "wide");
  pop.querySelector("[data-act=check]").onclick = () => { closePop(); post("/api/check_providers", {}); };
  pop.querySelectorAll("[data-editkey]").forEach(btn => btn.onclick = ev => {
    ev.stopPropagation();
    const box = pop.querySelector(`[data-keybox="${btn.dataset.editkey}"]`);
    if (!box) return;
    box.hidden = !box.hidden;
    if (!box.hidden) box.querySelector("input").focus();
  });
  const saveKey = async (p, api_key) => {
    const ok = await post("/api/provider_key", { provider:p, api_key });
    if (ok) closePop();
  };
  pop.querySelectorAll("[data-savekey]").forEach(btn => {
    const p = btn.dataset.savekey, box = pop.querySelector(`[data-keybox="${p}"]`), inp = box.querySelector("input");
    const submit = () => { if (inp.value.trim()) saveKey(p, inp.value.trim()); };

    inp.onkeydown = ev => { if (ev.key === "Enter") submit(); };

// ---- glossary tab: this recording's words, then the rest of its folder (ticket 10, Part D, redesigned) ----
// The server groups each word once and says where it may be dragged (targets: group -> action).
const GLOSS_GROUPS = {
  new:     { name:"New", waiting:true, desc:"Found in this recording. Waiting for a second recording, or for you." },
  heard:   { name:"Heard", desc:"Glossary words said in this recording." },
  added:   { name:"Added by you", desc:"Your words, speaker names and transcript fixes. Active at once, from the next recording." },
  active:  { name:"Active", desc:"Sent to every transcription in this folder." },
  waiting: { name:"Waiting", waiting:true, desc:"Seen in one recording so far." },
  blocked: { name:"Blocked" },
};
const GLOSS_DROP = { use:"Drop to use now", add:"Drop to make it yours", block:"Drop to remove", restore:"Drop to restore" };
const glossCache = {};          // rec id -> last view, so a redraw never flashes "Loading…"
let glossBusy = false;          // a drag or a delete question is open: the poll must not redraw under it
let glossSure = null;           // the blocked word whose "Delete for good?" is showing
let glossToastTimer;

function glossTip(w, action, folder) {
  if (action === "use") return `Use now: send it to every transcription in ${folder}`;
  if (action === "restore") return `Restore to ${GLOSS_GROUPS[Object.keys(w.targets)[0]].name}`;
  if (action === "delete") return "Delete for good";
  return "Remove: move to Blocked";
}
function glossMeta(w) {
  const bits = [];
  if (w.said) bits.push(`said ${w.said}×`);
  if (w.recordings) bits.push(`${w.recordings} recording${w.recordings === 1 ? "" : "s"}`);
  if (w.last) bits.push(`last ${w.last}`);
  if (w.home) bits.push(`from ${w.home}`);
  return bits.join(" · ");
}
function glossChip(w, folder) {
  const blocked = w.group === "blocked", t = esc(w.term);
  const kindIcon = w.kind === "speaker" ? ic("user") : w.kind === "yours" ? ic("pen") : "";
  const btn = (action, icon) => `<button data-act="${action}" data-term="${t}" data-tip="${esc(glossTip(w, action, folder))}" aria-label="${esc(glossTip(w, action, folder))}: ${t}">${ic(icon)}</button>`;
  let acts;
  if (blocked && glossSure === w.term)
    acts = `<button class="sure" data-act="delete" data-term="${t}">Delete for good</button><button data-act="keep" data-term="${t}">Keep</button>`;
  else if (blocked)
    acts = btn("restore", "undo") + (w.forever ? `<button data-act="ask" data-term="${t}" data-tip="Delete for good" aria-label="Delete for good: ${t}">${ic("x")}</button>` : "");
  else
    acts = (w.targets && Object.values(w.targets).includes("use") ? btn("use", "up") : "") + btn("block", "x");
  const meta = glossMeta(w);
  return `<span class="gw ${blocked ? "" : w.kind}${GLOSS_GROUPS[w.group].waiting ? " waiting" : ""}${glossSure === w.term ? " open" : ""}" tabindex="0" draggable="${!blocked || Object.keys(w.targets).length ? "true" : "false"}" data-term="${t}">
    <span class="w"${meta ? ` data-tip="${esc(meta)}"` : ""}>${kindIcon}<b>${t}</b>${w.group === "heard" ? `<span class="cnt">${w.said}×</span>` : ""}${blocked && w.home && !w.forever ? `<span class="from">· ${esc(w.home)}</span>` : ""}</span>
    <span class="acts">${acts}</span></span>`;
}
function glossHtml(g, r) {
  const by = id => g.words.filter(w => w.group === id);
  const card = id => {
    const list = by(id), d = GLOSS_GROUPS[id];
    return `<div class="g-card" data-zone="${id}"><span class="g-hint"></span><h3><span class="g-dot${d.waiting ? " waiting" : ""}"></span>${d.name} <span class="n">${list.length}</span></h3><p>${d.desc}</p>
      <div class="g-chips">${list.map(w => glossChip(w, g.folder)).join("") || `<span class="g-none">None</span>`}</div></div>`;
  };
  const scope = (ids, title, sub) => {
    const n = ids.reduce((s, id) => s + by(id).length, 0);
    return `<section class="g-scope"><h2>${title} <span class="num">${n}</span></h2><p>${sub}</p><div class="g-cols">${ids.map(card).join("")}</div></section>`;
  };
  const blocked = by("blocked");
  return `<div class="g-top"><div><p>Words the transcriber should spell right in <b style="color:var(--ink);font-weight:550">${esc(g.folder)}</b>${g.inbox ? ", which uses every folder's words" : ""}. Each word shows once: in this recording if it was found, heard or added here, otherwise in the rest of the folder. Drag a word, or use its buttons, to move it.</p>
      <div class="g-legend"><span><i class="speaker"></i>Speaker</span><span><i class="yours"></i>Yours</span><span><i></i>Found by the AI</span><span><i class="waiting"></i>Waiting</span></div></div>
    <form class="g-add" novalidate><input class="g-word" placeholder="Add a word to ${esc(g.folder)}" aria-label="Add a word" autocomplete="off" maxlength="120"><button class="primary" type="submit">${ic("plus")}Add</button><span class="err" role="alert"></span></form></div>
    ${scope(["new", "heard", "added"], "This recording", "Words this recording found, used, or got from you.")}
    ${scope(["active", "waiting"], `Rest of ${esc(g.folder)}`, "Folder words this recording didn't use.")}
    <div class="g-card g-bin" data-zone="blocked"><span class="g-hint"></span><h3>${ic("trash")}Blocked <span class="n">${blocked.length}</span></h3>
      <p>Removed words. They never come back by themselves; remove one again to delete it for good.</p>
      <div class="g-chips">${blocked.map(w => glossChip(w, g.folder)).join("") || `<span class="g-none">None</span>`}</div></div>`;
}
function glossToast(msg, undo) {
  let el = document.getElementById("g-toast");
  if (!el) { el = document.createElement("div"); el.id = "g-toast"; el.className = "g-toast"; el.setAttribute("role", "status"); document.body.append(el); }
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button>Undo</button>` : ""}`;
  el.hidden = false;
  clearTimeout(glossToastTimer);
  glossToastTimer = setTimeout(() => el.hidden = true, 6000);
  if (undo) el.querySelector("button").onclick = () => { el.hidden = true; undo(); };
}
async function renderGlossary(panel, r) {
  const draw = g => {
    if (UI.rec !== r.id || UI.tab !== "glossary" || !panel.isConnected) return;
    const typed = panel.querySelector(".g-word")?.value || "";
    glossTipHide();
    panel.innerHTML = `<div class="glossary">${glossHtml(g, r)}</div>`;
    panel.querySelector(".g-word").value = typed;
    const tab = document.querySelector('.tab[data-tab="glossary"] .c');
    if (tab) tab.textContent = g.sent;
    wireGlossary(panel, r, draw);
  };
  if (glossCache[r.id]) draw(glossCache[r.id]); else panel.innerHTML = `<p class="mute">Loading…</p>`;
  const res = await fetch(`/api/recordings/${encodeURIComponent(r.id)}/glossary`);
  if (!res.ok) { if (!glossCache[r.id] && panel.isConnected) panel.innerHTML = `<p class="err">${esc((await res.json()).detail || "Couldn't read the glossary")}</p>`; return; }
  const g = await res.json();
  if (JSON.stringify(g) === JSON.stringify(glossCache[r.id]) && panel.querySelector(".glossary")) return;
  glossCache[r.id] = g;
  if (!glossBusy) draw(g);
}
// One tip element in <body>, clamped to the window: a tip drawn inside the tab got cut off at the edges.
let glossTipEl, glossTipTimer;
function glossTipShow(el) {
  clearTimeout(glossTipTimer);
  glossTipTimer = setTimeout(() => {
    if (!el.isConnected || el.closest(".dragging")) return;
    if (!glossTipEl) { glossTipEl = document.createElement("div"); glossTipEl.className = "g-tip"; glossTipEl.setAttribute("role", "tooltip"); document.body.append(glossTipEl); }
    glossTipEl.textContent = el.dataset.tip; glossTipEl.hidden = false;
    const r = el.getBoundingClientRect(), w = glossTipEl.offsetWidth, h = glossTipEl.offsetHeight;
    glossTipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
    glossTipEl.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + "px";
  }, 250);
}
function glossTipHide() { clearTimeout(glossTipTimer); if (glossTipEl) glossTipEl.hidden = true; }
addEventListener("scroll", glossTipHide, { passive:true });
// While a word is dragged, holding it near the top or bottom of the window scrolls the page, faster
// the closer it is to the edge, so any group is reachable.
let glossScroll = null;
document.addEventListener("dragover", e => { if (glossScroll) glossScroll.y = e.clientY; });
function glossAutoScroll(on) {
  if (!on) { glossScroll = null; return; }
  const state = glossScroll = { y: innerHeight / 2 };
  const top = (document.querySelector("header.top")?.offsetHeight || 0) + 80, bottom = innerHeight - 80;
  const step = () => {
    if (glossScroll !== state) return;
    const v = state.y < top ? state.y - top : state.y > bottom ? state.y - bottom : 0;
    if (v) scrollBy(0, Math.max(-28, Math.min(28, v / 3)));
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function wireGlossary(panel, r, draw) {
  const root = panel.querySelector(".glossary"), g = glossCache[r.id];
  const word = t => g.words.find(w => w.term === t);
  const act = async (action, term, done) => {
    let res, body;
    try {
      res = await fetch(`/api/recordings/${encodeURIComponent(r.id)}/glossary`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ action, term }) });
      body = await res.json();
    } catch {
      return "Couldn't reach the dashboard server. Check that it's running, then try again.";
    }
    if (!res.ok) {
      if (res.status === 409) { glossToast(body.detail); delete glossCache[r.id]; renderGlossary(panel, r); }
      return body.detail || "Couldn't change the glossary";
    }
    glossCache[r.id] = body; draw(body);
    if (done) done();
    load();   // the folder counts in the rail and the Transcribe-again line
  };
  const run = async (action, term) => {
    const w = word(term);
    if (action === "delete") { glossSure = null; glossBusy = false; }
    const done = { block: () => glossToast(`${term} moved to Blocked`, () => act("restore", term)), use: () => glossToast(`${term} is active`),
      add: () => glossToast(`${term} is now yours`), delete: () => glossToast(`${term} deleted for good`),
      restore: () => glossToast(`${term} restored to ${GLOSS_GROUPS[Object.keys(w.targets)[0]].name}`) }[action];
    const problem = await act(action, term, done);
    if (problem) glossToast(problem);
  };
  // The word under the mouse opens and the words after it move aside. The last word on a line would wrap
  // to the next one (out from under the mouse), so it spills into the room .g-chips keeps on its right.
  let hot = null, at = "";
  const open = chip => {
    if (chip === hot) return;
    if (hot) { hot.classList.remove("hot"); hot.style.marginRight = ""; }
    hot = chip;
    if (!chip) return;
    const left = chip.getBoundingClientRect().left, top = chip.offsetTop;
    chip.classList.add("hot");
    if (chip.offsetTop === top) return;
    const box = chip.parentElement, end = box.getBoundingClientRect().right - parseFloat(getComputedStyle(box).paddingRight);
    chip.style.marginRight = `${Math.floor(end - left - chip.getBoundingClientRect().width) - 1}px`;
  };
  root.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el && !el.contains(e.relatedTarget)) glossTipShow(el); });
  root.addEventListener("mouseout", e => { const el = e.target.closest("[data-tip]"); if (el && !el.contains(e.relatedTarget)) glossTipHide(); });
  root.addEventListener("focusin", e => { if (e.target.matches("[data-tip]:focus-visible")) glossTipShow(e.target); });
  root.addEventListener("focusout", glossTipHide);
  root.addEventListener("mousemove", e => {
    const point = e.clientX + "," + e.clientY;
    if (point === at) return;   // the browser re-sends the same point after a layout change: not a move
    at = point;
    const chip = e.target.closest(".gw");
    if (chip || !e.target.closest(".g-chips")) open(chip);
  });
  root.addEventListener("mouseleave", () => open(null));
  root.addEventListener("click", e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const { act: action, term } = b.dataset;
    if (action === "ask") { glossSure = term; glossBusy = true; return draw(g); }
    if (action === "keep") { glossSure = null; glossBusy = false; return draw(g); }
    run(action, term);
  });
  const form = root.querySelector(".g-add"), input = form.querySelector("input"), err = form.querySelector(".err");
  const fail = m => { err.textContent = m; input.setAttribute("aria-invalid", "true"); input.focus(); };
  input.oninput = () => { err.textContent = ""; input.removeAttribute("aria-invalid"); };
  form.onsubmit = async e => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t) return fail("Type a word first.");
    const have = g.words.find(w => w.term.toLowerCase() === t.toLowerCase() && w.group !== "blocked");
    if (have?.group === "added") return fail(`${have.term} is already yours here.`);
    const problem = await act("add", t, () => glossToast(`${t} added`));
    if (problem) return fail(problem);
    const fresh = panel.querySelector(".g-word"); fresh.value = ""; fresh.focus();
  };
  // drag a chip onto a group: only the groups its targets name accept it
  let dragged = null;
  const zones = [...root.querySelectorAll("[data-zone]")];
  const begin = chip => {
    dragged = word(chip.dataset.term); if (!dragged) return false;
    glossBusy = true; glossTipHide(); open(null);
    root.classList.add("dragging"); chip.classList.add("lifted");
    for (const z of zones) {
      const action = dragged.targets[z.dataset.zone];
      z.classList.toggle("can-drop", !!action);
      z.querySelector(".g-hint").textContent = action ? GLOSS_DROP[action] : "";
    }
    glossAutoScroll(true);
    return true;
  };
  const clear = () => { root.classList.remove("dragging"); zones.forEach(z => z.classList.remove("can-drop", "over")); root.querySelector(".lifted")?.classList.remove("lifted"); dragged = null; glossBusy = !!glossSure; glossAutoScroll(false); };
  // A mouse drags with pointer events: during the browser's own drag and drop, Windows ignores the wheel.
  // Touch screens keep the browser's drag (a long press), below.
  let press = null, mouse = false;
  const zoneAt = (x, y) => document.elementFromPoint(x, y)?.closest(".can-drop");
  const track = () => { if (press?.ghost) { const z = zoneAt(press.x, press.y); zones.forEach(o => o.classList.toggle("over", o === z)); } };
  const stop = drop => {
    const p = press; press = null;
    if (!p?.ghost) return;
    const z = drop && zoneAt(p.x, p.y), action = z && dragged?.targets[z.dataset.zone], term = dragged?.term;
    p.ghost.remove(); removeEventListener("scroll", track); removeEventListener("keydown", p.esc, true);
    clear();
    if (action) run(action, term);
  };
  root.addEventListener("pointerdown", e => {
    mouse = e.pointerType === "mouse";
    glossTipHide();
    const chip = e.target.closest(".gw[draggable=true]");
    if (mouse && e.button === 0 && chip && !e.target.closest("button")) press = { chip, id:e.pointerId, x:e.clientX, y:e.clientY, x0:e.clientX, y0:e.clientY };
  });
  root.addEventListener("pointermove", e => {
    if (!press || e.pointerId !== press.id) return;
    press.x = e.clientX; press.y = e.clientY;
    if (!press.ghost) {
      if (Math.hypot(press.x - press.x0, press.y - press.y0) < 5 || !begin(press.chip)) return;
      const r = press.chip.getBoundingClientRect(), ghost = press.chip.cloneNode(true);
      ghost.classList.remove("lifted", "hot"); ghost.classList.add("g-ghost"); ghost.style.cssText = `width:${r.width}px`;
      root.append(ghost);
      Object.assign(press, { ghost, dx:press.x0 - r.left, dy:press.y0 - r.top, esc:k => { if (k.key === "Escape") stop(false); } });
      root.setPointerCapture(press.id);
      getSelection().removeAllRanges();
      addEventListener("scroll", track, { passive:true }); addEventListener("keydown", press.esc, true);
    }
    press.ghost.style.left = `${press.x - press.dx}px`; press.ghost.style.top = `${press.y - press.dy}px`;
    if (glossScroll) glossScroll.y = press.y;
    track();
  });
  root.addEventListener("pointerup", e => { if (press && e.pointerId === press.id) stop(true); });
  root.addEventListener("pointercancel", () => stop(false));
  root.addEventListener("lostpointercapture", () => stop(false));
  root.addEventListener("dragstart", e => {
    const chip = e.target.closest(".gw[draggable=true]"); if (!chip) return;
    if (mouse) return e.preventDefault();   // the pointer drag above has it
    if (!begin(chip)) return;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("application/x-plaud-word", dragged.term);   // not text/plain: the folder rail takes that as a recording
  });
  root.addEventListener("dragend", clear);
  for (const z of zones) {
    z.addEventListener("dragover", e => { if (dragged && z.classList.contains("can-drop")) { e.preventDefault(); z.classList.add("over"); } });
    z.addEventListener("dragleave", e => { if (!z.contains(e.relatedTarget)) z.classList.remove("over"); });
    z.addEventListener("drop", e => {
      e.preventDefault();
      const action = dragged && dragged.targets[z.dataset.zone], term = dragged?.term;
      clear();
      if (action) run(action, term);
    });
  }
}

// ---- top bar, jobs, polling ----
const jobsBtn = document.getElementById("jobs-btn"), jobsPop = document.getElementById("jobs-pop");
jobsBtn.onclick = () => { jobsPop.hidden = !jobsPop.hidden; jobsBtn.setAttribute("aria-expanded", !jobsPop.hidden); };
document.addEventListener("click", e => { if (!jobsPop.hidden && !jobsPop.contains(e.target) && !jobsBtn.contains(e.target)) { jobsPop.hidden = true; jobsBtn.setAttribute("aria-expanded", "false"); } });
document.getElementById("menu").onclick = () => document.getElementById("shell").classList.toggle("rail-open");

let viewKey = "";
const viewState = () => JSON.stringify([UI.rec, UI.tab, recOf(UI.rec), S.not_imported.find(x => x.id === UI.rec),
  S.jobs.filter(j => j.rec_id === UI.rec).map(j => j.status + j.id), S.providers, S.provider_config, S.blueprints, S.groups]);
function render(forced) {
  for (const f of pendingFolders) if (S.groups.includes(f)) pendingFolders.delete(f);
  renderRail();
  if (settings.open) { const r = recOf(UI.rec); if (r) openSettings(r); }
  // redraw the open recording only when something it shows changed, so scroll and playback survive refreshes
  if (forced || viewState() !== viewKey) renderView();
}
const jobSeen = {};
function forgetFinished() {
  for (const j of S.jobs) {
    if (jobSeen[j.id] && jobSeen[j.id] !== j.status && j.status === "done") forget(j.rec_id);
    jobSeen[j.id] = j.status;
  }
}

let jobsBtnKey = "", jobsPopKey = "";
function renderJobsUI() {
  if (!S) return;
  const n = st => S.jobs.filter(j => j.status === st).length;
  const runJob = S.jobs.find(j => j.status === "running");
  const lp = runJob ? liveProgress(runJob) : null;
  const running = n("running") + n("queued"), failed = n("failed"), paused = n("paused");

  const bKey = [runJob?.id || 0, !!lp, running, paused, failed].join(":");
  if (bKey !== jobsBtnKey) {
    jobsBtnKey = bKey;
    if (runJob) {
      const pct = lp ? Math.round(lp.pct) : 0;
      const parts = [
        `<span class="stack" style="gap:6px;flex-wrap:nowrap">${spiral("sm")}<span class="num" style="color:var(--acc);font-weight:600">${lp ? `<span class="jbtn-pct">${pct}%</span>` : `${running} running`}</span>${lp ? `<span class="mute num jbtn-eta">${lp.overdue ? "slow" : fmtEta(lp.eta_s)}</span>` : ""}${running > 1 ? `<span class="mute num">+${running - 1}</span>` : ""}</span>`,
        paused && `<span style="color:var(--acc)">${paused} paused</span>`,
        failed && `<span style="color:var(--bad)">${failed} failed</span>`
      ].filter(Boolean).join('<span class="mute">·</span>');
      jobsBtn.innerHTML = parts + (lp ? `<span class="jbtn-bar" style="width:${lp.pct}%"></span>` : "");
    } else {
      jobsBtn.innerHTML = paused || failed
        ? [paused && `<span style="color:var(--acc)">${paused} paused</span>`, failed && `<span style="color:var(--bad)">${failed} failed</span>`].filter(Boolean).join('<span class="mute">·</span>')
        : `<span class="mute">No jobs running</span>`;
    }
  } else if (runJob && lp) {
    const pctEl = jobsBtn.querySelector(".jbtn-pct"), etaEl = jobsBtn.querySelector(".jbtn-eta"), barEl = jobsBtn.querySelector(".jbtn-bar");
    if (pctEl) pctEl.textContent = `${Math.round(lp.pct)}%`;
    if (etaEl) etaEl.textContent = lp.overdue ? "slow" : fmtEta(lp.eta_s);
    if (barEl) barEl.style.width = `${lp.pct}%`;
  }

  const pKey = S.jobs.map(j => `${j.id}:${j.status}:${j.error || ""}:${j.not_before}:${j.progress?.steps || 0}`).join("|");
  const jobsEl = document.getElementById("jobs");
  if (pKey !== jobsPopKey) {
    jobsPopKey = pKey;
    jobsEl.innerHTML = S.jobs.map(j => {
      const t = [...S.recordings, ...S.not_imported].find(r => r.id === j.rec_id);
      const title = t ? t.title : j.rec_id;
      if (j.status === "running") {
        const p = liveProgress(j) || { pct: 5, eta_s: 15, elapsed_s: 0, stage_label: "Working", step: 1, steps: 1, stages: [] };
        return `<div class="jcard" data-jcard="${j.id}">
          <div class="jcard-top">${spiral()}<span class="jcard-title">${esc(title)}</span><span class="pill attn">${esc(kindLabel(j.kind))}</span><span class="jcard-pct num">${Math.round(p.pct)}%</span></div>
          <div class="pbar"><div class="pbar-fill" style="width:${p.pct}%"></div></div>
          <div class="jcard-meta"><span class="jcard-status"><span class="jcard-msg">${esc(j.msg || p.stage_label || "Starting…")}</span></span><span class="jcard-eta num">${etaText(p)} · ${fmtClock(p.elapsed_s)}</span></div>
          ${stepperHtml(p)}
        </div>`;
      }
      const message = j.msg || j.error;
      const retry = j.status === "failed" || (j.status === "paused" && !/^sign in to /i.test(j.error || "")) || (j.status === "queued" && j.error);
      const wait = j.status === "queued" && j.not_before > Date.now() / 1000 ? " · retry after " + new Date(j.not_before * 1000).toLocaleString() : "";
      const lead = j.status === "queued" ? `<span class="qdot"></span>` : "";
      return `<div class="jrow ${j.status}"><div class="jrow-main">${lead}<span>${esc(j.status)} · ${esc(kindLabel(j.kind))} · ${esc(title)}${message ? " — " + esc(message) : ""}${esc(wait)}</span></div>${retry ? `<button class="ghost" data-retry="${j.id}">Retry</button>` : ""}</div>`;
    }).join("") || '<div class="jrow mute">nothing running</div>';
    jobsEl.querySelectorAll("[data-retry]").forEach(b => b.onclick = () => post("/api/retry", { job:+b.dataset.retry }));
  } else {
    for (const j of S.jobs) {
      if (j.status !== "running") continue;
      const card = jobsEl.querySelector(`[data-jcard="${j.id}"]`);
      const p = liveProgress(j);
      if (!card || !p) continue;
      card.querySelector(".pbar-fill").style.width = `${p.pct}%`;
      card.querySelector(".jcard-pct").textContent = `${Math.round(p.pct)}%`;
      card.querySelector(".jcard-msg").textContent = j.msg || p.stage_label || "Working…";
      card.querySelector(".jcard-eta").textContent = `${etaText(p)} · ${fmtClock(p.elapsed_s)}`;
      card.querySelectorAll("[data-step-idx]").forEach(el => {
        const i = +el.dataset.stepIdx + 1;
        el.className = `pstep ${i < p.step ? "done" : i === p.step ? "now" : "todo"}`;
      });
    }
  }

  const banner = document.querySelector("[data-job-banner]");
  if (banner) {
    const j = S.jobs.find(x => String(x.id) === banner.dataset.jobBanner);
    const p = j?.status === "running" ? liveProgress(j) : null;
    if (j && p) {
      banner.querySelector(".pbar-fill").style.width = `${p.pct}%`;
      banner.querySelector(".jb-pct").textContent = `${Math.round(p.pct)}%`;
      banner.querySelector(".jb-eta").textContent = etaText(p);
      const st = banner.querySelector(".jb-stage"); if (st) st.textContent = p.stage_label || "Working";
      const mg = banner.querySelector(".jb-msg"); if (mg) mg.textContent = j.msg || "Starting…";
      banner.querySelectorAll("[data-step-idx]").forEach(el => {
        const i = +el.dataset.stepIdx + 1;
        el.className = `pstep ${i < p.step ? "done" : i === p.step ? "now" : "todo"}`;
      });
    }
  }

  document.querySelectorAll("[data-job-pct]").forEach(el => {
    const j = S.jobs.find(x => String(x.id) === el.dataset.jobPct);
    const p = j?.status === "running" ? liveProgress(j) : null;
    if (p) el.textContent = `${Math.round(p.pct)}%`;
  });
}

async function load() {
  const txt = await (await fetch("/api/state")).text();
  S = JSON.parse(txt);
  stateAt = Date.now();
  forgetFinished();
  const plaudPaused = S.jobs.some(j => j.status === "paused" && !/^sign in to /i.test(j.error || ""));
  const provPaused = [...new Set(S.jobs.filter(j => j.status === "paused" && /^sign in to /i.test(j.error || "")).map(j => j.error))];
  const auth = document.getElementById("auth");
  const authMsgs = [];
  if (/AUTH_FAILED|sign-in expired/i.test(S.plaud_error) || plaudPaused)
    authMsgs.push("Plaud sign-in expired. Run `plaud login` in a terminal; downloads resume after the next account check.");
  authMsgs.push(...provPaused);
  auth.hidden = !authMsgs.length;
  auth.textContent = authMsgs.join(" · ");
  const doc = document.getElementById("doctor");
  doc.textContent = S.doctor.summary;
  doc.title = S.started_at ? "server started at " + S.started_at : "";
  const checks = S.provider_checks || {}, names = providerNames(), checkedCount = names.filter(p => p in checks).length;
  const trouble = names.some(p => p in checks && !S.providers.includes(p) && !gone(checks[p]));
  const ai = document.getElementById("ai-btn");
  ai.style.setProperty("--c", S.providers.length && !trouble ? "var(--ink)" : "var(--acc)");
  ai.innerHTML = `<span class="d"></span><span>AI<span class="lbl">${checking() ? ": checking…" : checkedCount ? `: ${S.providers.length} of ${names.length} ready` : ": not checked"}</span></span>`;
  renderJobsUI();
  const body = JSON.stringify({ ...S, jobs: S.jobs.map(j => j.status + j.id) });
  // don't redraw under the user's hands: wait while a field is focused or has unsaved text
  const typing = glossBusy || (document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName) && document.activeElement.id !== "q")
    || [...document.querySelectorAll(".newgrp")].some(i => i.value);
  if (force || (body !== last && !typing)) { const forced = force; last = body; force = false; render(forced); }
}
let pollTimer = null;
async function pollLoop() {
  clearTimeout(pollTimer);
  try { await load(); } catch {}
  const active = S?.jobs?.some(j => j.status === "running" || j.status === "queued");
  pollTimer = setTimeout(pollLoop, active ? 1500 : 3000);
}
pollLoop();
setInterval(() => {
  if (S && S.jobs.some(j => j.status === "running")) renderJobsUI();
}, 1000);
</script>
